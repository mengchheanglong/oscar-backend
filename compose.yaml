name: continuum-backend

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: ai_workspace
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: ai_workspace
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_workspace -d ai_workspace']
      interval: 5s
      timeout: 3s
      retries: 15

  postgres-test:
    profiles: ['test']
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: ai_workspace_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: ai_workspace_test
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_workspace_test -d ai_workspace_test']
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    profiles: ['app']
    build: .
    image: continuum-backend:local
    command: ['pnpm', 'migration:run:prod']
    environment:
      DATABASE_URL: postgresql://ai_workspace:local_dev_only@postgres:5432/ai_workspace
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build: .
    image: continuum-backend:local
    environment:
      NODE_ENV: development
      PORT: '3000'
      HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://ai_workspace:local_dev_only@postgres:5432/ai_workspace
      FOLDER_STORAGE_QUOTA_BYTES: ${FOLDER_STORAGE_QUOTA_BYTES:-21474836480}
      FOLDER_MAX_FILE_BYTES: ${FOLDER_MAX_FILE_BYTES:-1073741824}
      FOLDER_MAX_FILES: ${FOLDER_MAX_FILES:-100000}
      FOLDER_MAX_SOURCES: ${FOLDER_MAX_SOURCES:-100}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /app/var/uploads
      SWAGGER_ENABLED: 'true'
      AI_ENABLED: 'false'
      GITHUB_ENABLED: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - upload-data:/app/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  upload-data:
