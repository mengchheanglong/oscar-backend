services:
  # ==============================================================================
  # Continuum Backend (NestJS + Express)
  # ==============================================================================
  - type: web
    name: oscar-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:prod
    healthCheckPath: /api/v1/auth/session
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        sync: false # Set to your frontend URL (e.g., https://oscar-frontend.onrender.com)
      - key: DATABASE_URL
        sync: false # Set to your Supabase PostgreSQL connection string (pooler)
      - key: REDIS_URL
        fromService:
          type: redis
          name: continuum-redis
          property: connectionString
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: ./var/uploads
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: info

  # ==============================================================================
  # Render Key-Value Redis (Free Tier)
  # ==============================================================================
  - type: redis
    name: continuum-redis
    plan: free
    region: singapore
    ipAllowList: [] # Accessible only within Render private network
